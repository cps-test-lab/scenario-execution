---
name: test-build
on:
  pull_request:
    branches: [main, humble, jazzy]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["test-image"]
    types:
      - completed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  # One source, every supported ROS distro: the same build and suites, per distro
  # (test_distro.yml). Neither cancels the other when it fails.
  test:
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy, lyrical]
    permissions:
      contents: read
      packages: write
      checks: write
      pull-requests: write
    uses: ./.github/workflows/test_distro.yml
    with:
      ros_distro: ${{ matrix.ros_distro }}
    secrets: inherit

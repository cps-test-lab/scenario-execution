---
name: test-build
on:
  pull_request:
    branches: [main, humble, jazzy]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["test-image"]
    types:
      - completed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  # One source, every supported ROS distro: the same build and suites, per distro
  # (test_distro.yml). Neither cancels the other when it fails.
  test:
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy, lyrical]
    permissions:
      contents: read
      packages: write
      checks: write
      pull-requests: write
    uses: ./.github/workflows/test_distro.yml
    with:
      ros_distro: ${{ matrix.ros_distro }}
    secrets: inherit

  # The branch rule requires one check by name. A matrix leg reports under its own name, so
  # this job is that name: it is green only when every distro's leg is, and it runs even when
  # one did not, because a skipped required check counts as passed.
  tests:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every distro passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "a distro did not pass: $RESULT"
            exit 1
          fi
